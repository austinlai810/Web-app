<!DOCTYPE html>
<html>
<head>
  <title>Notes</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="home-btn" aria-label="Home">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
    </a>
    <span class="topbar-title">Notes</span>
  </header>
  <div class="notes-layout">
    <div class="sidebar">
      <button id="new-note-btn">+ New Note</button>
      <div id="notes-list"></div>
    </div>
    <div class="editor">
      <input id="title-input" placeholder="Title">
      <textarea id="content-input" placeholder="Start typing..."></textarea>
      <button id="save-btn">Save</button>
      <button id="delete-btn">Delete</button>
    </div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
